<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>മഹാഭാരത യുദ്ധം - Kurukshetra War</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0d0d0d;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin: 5px;
            color: #ffcc00;
            text-shadow: 2px 2px 6px #ff4500;
        }
        canvas {
            border: 4px solid #ffcc00;
            background: linear-gradient(to bottom, #2b1300, #5c2600);
            box-shadow: 0px 0px 25px rgba(255, 204, 0, 0.4);
        }
        .instructions {
            margin-top: 10px;
            font-size: 14px;
            color: #ffeb3b;
        }
    </style>
</head>
<body>

    <h1>மகாபாரதப் போர்: பாண்டவர் vs கௌரவர்</h1>
    <canvas id="gameCanvas" width="850" height="450"></canvas>
    <div class="instructions">பாண்டவப் படை இயக்கம்: இடது/வலது அம்புக்குறி | குதிக்க: மேல் அம்புக்குறி | தெய்வீக அஸ்திரம் ஏவ: Spacebar</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // கேம் மாறிகள்
        let score = 0;
        let dharmarajaEnergy = 100;
        let gameOvr = false;
        let gameWon = false;

        // பாண்டவப் படை வீரன் (அர்ச்சுனன் / தங்கக் கவசம் அணிந்தவர்)
        let pandavaHero = {
            x: 60,
            y: 310,
            width: 45,
            height: 65,
            speed: 5,
            dy: 0,
            jumpPower: -13,
            grounded: true,
            color: "#ffcc00" // தங்க நிற கவசம்
        };

        // பாண்டவப் படை வீரர்கள் (துணை பாத்திரங்கள் பட்டியல்)
        const pandavasList = ["கிருஷ்ணன்", "அர்ச்சுனன்", "தர்மன்", "பீமன்", "நகுலன்", "சகாதேவன்", "துஷ்டதுய்மன்", "சாத்யகி", "துருபதன்", "விராட மன்னன்"];

        // அஸ்திரங்கள் (Arrows)
        let divineArrows = [];

        // கௌரவப் படை எதிரிகள் (பீஷ்மர், துரோணாச்சாரியார், கர்ணன், துரியோதனன் மற்றும் படைவீரர்கள்)
        let kauravaEnemies = [];
        const kauravasList = ["பீஷ்மர்", "துரோணாச்சாரியார்", "கர்ணன்", "துரியோதனன்", "அசுவத்தாமன்", "சகுனி", "துச்சாதனன்", "சல்லியன்", "யானை படை", "குதிரை படை"];
        
        let enemyTimer = 0;

        // விசைப்பலகை கன்ட்ரோல்
        let keys = {};
        window.addEventListener("keydown", (e) => {
            keys[e.code] = true;
            if (e.code === "Space" && !gameOvr) {
                divineArrows.push({
                    x: pandavaHero.x + pandavaHero.width,
                    y: pandavaHero.y + 20,
                    width: 22,
                    height: 6,
                    speed: 9,
                    color: "#00ffff"
                });
            }
        });
        window.addEventListener("keyup", (e) => {
            keys[e.code] = false;
        });

        // கௌரவப் படை வீரர்களை உருவாக்குதல்
        function spawnKauravaEnemy() {
            if (Math.random() < 0.02) {
                let randomName = kauravasList[Math.floor(Math.random() * kauravasList.length)];
                kauravaEnemies.push({
                    x: canvas.width,
                    y: 315,
                    width: 45,
                    height: 60,
                    speed: 2.5 + Math.random() * 2,
                    name: randomName,
                    color: "#cc3300" // கௌரவப் படை சிவப்பு/கருப்பு நிற தோற்றம்
                });
            }
        }

        // விளையாட்டு லாஜிக் புதுப்பித்தல்
        function update() {
            if (gameOvr || gameWon) return;

            // பாண்டவ வீரர் இயக்கம்
            if (keys["ArrowLeft"] && pandavaHero.x > 0) {
                pandavaHero.x -= pandavaHero.speed;
            }
            if (keys["ArrowRight"] && pandavaHero.x < canvas.width / 2) {
                pandavaHero.x += pandavaHero.speed;
            }
            if (keys["ArrowUp"] && pandavaHero.grounded) {
                pandavaHero.dy = pandavaHero.jumpPower;
                pandavaHero.grounded = false;
            }

            // ஈர்ப்பு விசை
            pandavaHero.dy += 0.65;
            pandavaHero.y += pandavaHero.dy;

            if (pandavaHero.y > 310) {
                pandavaHero.y = 310;
                pandavaHero.dy = 0;
                pandavaHero.grounded = true;
            }

            // அஸ்திர நகர்வு
            for (let i = divineArrows.length - 1; i >= 0; i--) {
                divineArrows[i].x += divineArrows[i].speed;
                if (divineArrows[i].x > canvas.width) {
                    divineArrows.splice(i, 1);
                }
            }

            // கௌரவப் படை எதிரிகளை நகர்த்துவது மற்றும் மோதுவது
            spawnKauravaEnemy();
            for (let i = kauravaEnemies.length - 1; i >= 0; i--) {
                kauravaEnemies[i].x -= kauravaEnemies[i].speed;

                // பாண்டவர் மீது கௌரவர் மோதும் போது ஆற்றல் குறையும்
                if (
                    pandavaHero.x < kauravaEnemies[i].x + kauravaEnemies[i].width &&
                    pandavaHero.x + pandavaHero.width > kauravaEnemies[i].x &&
                    pandavaHero.y < kauravaEnemies[i].y + kauravaEnemies[i].height &&
                    pandavaHero.y + pandavaHero.height > kauravaEnemies[i].y
                ) {
                    dharmarajaEnergy -= 20;
                    kauravaEnemies.splice(i, 1);
                    if (dharmarajaEnergy <= 0) {
                        gameOvr = true;
                    }
                    continue;
                }

                // அஸ்திரம் எதிரிகள் மீது படும் போது
                for (let j = divineArrows.length - 1; j >= 0; j--) {
                    if (
                        divineArrows[j].x < kauravaEnemies[i].x + kauravaEnemies[i].width &&
                        divineArrows[j].x + divineArrows[j].width > kauravaEnemies[i].x &&
                        divineArrows[j].y < kauravaEnemies[i].y + kauravaEnemies[i].height &&
                        divineArrows[j].y + divineArrows[j].height > kauravaEnemies[i].y
                    ) {
                        score += 15;
                        kauravaEnemies.splice(i, 1);
                        divineArrows.splice(j, 1);
                        break;
                    }
                }

                // வெற்றி நிலை (150 புள்ளிகள்)
                if (score >= 150) {
                    gameWon = true;
                }
            }
        }

        // வரையும் பகுதி (Graphics Rendering)
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // குருக்ஷேத்ர தரைக்களம்
            ctx.fillStyle = "#3d1f00";
            ctx.fillRect(0, 370, canvas.width, 80);

            // பாண்டவப் படை வீரன் (தங்க கவசம்)
            ctx.fillStyle = pandavaHero.color;
            ctx.fillRect(pandavaHero.x, pandavaHero.y, pandavaHero.width, pandavaHero.height);
            // கிரீடம்
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(pandavaHero.x + 8, pandavaHero.y - 12, 30, 10);

            // அஸ்திரங்கள்
            ctx.fillStyle = "#00ffff";
            divineArrows.forEach(arrow => {
                ctx.fillRect(arrow.x, arrow.y, arrow.width, arrow.height);
            });

            // கௌரவப் படை எதிரிகள்
            kauravaEnemies.forEach(enemy => {
                ctx.fillStyle = enemy.color;
                ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
                // எதிரியின் பெயர் மற்றும் அடையாளம்
                ctx.fillStyle = "#ffffff";
                ctx.font = "11px Arial";
                ctx.fillText(enemy.name, enemy.x - 5, enemy.y - 8);
            });

            // UI விவரங்கள் (Score & Energy)
            ctx.fillStyle = "#ffcc00";
            ctx.font = "16px Arial";
            ctx.fillText("பாண்டவப் படை ஆற்றல்: " + dharmarajaEnergy + "%", 20, 30);
            ctx.fillText("வெற்றிப் புள்ளிகள்: " + score + " / 150", 20, 55);

            // கேம் ஓவர்
            if (gameOvr) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff3300";
                ctx.font = "32px Arial";
                ctx.fillText("குருக்ஷேத்ரம்: தர்மம் பின்தங்கியது (Game Over)", 120, 220);
            }

            // வெற்றி
            if (gameWon) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#00ff00";
                ctx.font = "32px Arial";
                ctx.fillText("பாண்டவர்கள் வெற்றி பெற்றனர்! (Victory!)", 150, 220);
            }
        }

        // கேம் லூப்
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
