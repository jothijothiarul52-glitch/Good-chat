<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>மகாபாரதப் போர் - Kurukshetra War</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h2 {
            margin: 5px;
            color: #ffcc00;
        }
        canvas {
            border: 3px solid #ffcc00;
            background: linear-gradient(to bottom, #1a0f00, #4d2600);
        }
        .info {
            margin-top: 8px;
            font-size: 13px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <h2>மகாபாரதப் போர்: பாண்டவர் vs கௌரவர்</h2>
    <canvas id="gameCanvas" width="700" height="350"></canvas>
    <div class="info">நகர: இடது/வலது அம்புக்குறி | குதிக்க: மேல் அம்புக்குறி | அஸ்திரம்: Spacebar (மீண்டும் தொடங்க கிளிக் செய்யவும்)</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let health = 100;
        let isOver = false;
        let isWin = false;

        let player = {
            x: 50,
            y: 240,
            width: 30,
            height: 60,
            speed: 4,
            dy: 0,
            jump: -10,
            onGround: true
        };

        let bullets = [];
        let enemies = [];
        const enemyNames = ["பீஷ்மர்", "துரோணர்", "கர்ணன்", "துரியோதனன்", "யானை படை", "குதிரை படை"];

        let keys = {};
        window.addEventListener("keydown", e => {
            keys[e.code] = true;
            if (e.code === "Space" && !isOver && !isWin) {
                bullets.push({ x: player.x + player.width, y: player.y + 20, w: 18, h: 4, speed: 7 });
            }
        });
        window.addEventListener("keyup", e => { keys[e.code] = false; });

        function resetGame() {
            score = 0;
            health = 100;
            isOver = false;
            isWin = false;
            enemies = [];
            bullets = [];
            player.y = 240;
        }

        window.addEventListener("click", () => {
            if (isOver || isWin) resetGame();
        });

        function update() {
            if (isOver || isWin) return;

            if (keys["ArrowLeft"] && player.x > 0) player.x -= player.speed;
            if (keys["ArrowRight"] && player.x < canvas.width / 2) player.x += player.speed;
            if (keys["ArrowUp"] && player.onGround) {
                player.dy = player.jump;
                player.onGround = false;
            }

            player.dy += 0.5;
            player.y += player.dy;

            if (player.y > 240) {
                player.y = 240;
                player.dy = 0;
                player.onGround = true;
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].x += bullets[i].speed;
                if (bullets[i].x > canvas.width) bullets.splice(i, 1);
            }

            if (Math.random() < 0.018) {
                enemies.push({
                    x: canvas.width,
                    y: 245,
                    width: 30,
                    height: 55,
                    speed: 2 + Math.random() * 1.5,
                    name: enemyNames[Math.floor(Math.random() * enemyNames.length)]
                });
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].x -= enemies[i].speed;

                if (
                    player.x < enemies[i].x + enemies[i].width &&
                    player.x + player.width > enemies[i].x &&
                    player.y < enemies[i].y + enemies[i].height &&
                    player.y + player.height > enemies[i].y
                ) {
                    health -= 25;
                    enemies.splice(i, 1);
                    if (health <= 0) isOver = true;
                    continue;
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    if (
                        bullets[j].x < enemies[i].x + enemies[i].width &&
                        bullets[j].x + bullets[j].w > enemies[i].x &&
                        bullets[j].y < enemies[i].y + enemies[i].height &&
                        bullets[j].y + bullets[j].h > enemies[i].y
                    ) {
                        score += 10;
                        enemies.splice(i, 1);
                        bullets.splice(j, 1);
                        if (score >= 100) isWin = true;
                        break;
                    }
                }
            }
        }

        // மனித வடிவங்களை தத்ரூபமாக வரையும் பகுதி
        function drawMan(x, y, w, h, color, isHero) {
            // தலை
            ctx.fillStyle = "#ffdbac";
            ctx.beginPath();
            ctx.arc(x + w / 2, y + 10, 8, 0, Math.PI * 2);
            ctx.fill();

            // கிரீடம் / தலைப்பாகை
            ctx.fillStyle = isHero ? "#ffffff" : "#000000";
            ctx.fillRect(x + w / 2 - 6, y, 12, 4);

            // உடல் (கவசம்)
            ctx.fillStyle = color;
            ctx.fillRect(x + 5, y + 18, w - 10, 22);

            // கைகள்
            ctx.fillRect(x, y + 20, 5, 15);
            ctx.fillRect(x + w - 5, y + 20, 5, 15);

            // கால்கள்
            ctx.fillStyle = "#333";
            ctx.fillRect(x + 6, y + 40, 6, 15);
            ctx.fillRect(x + w - 12, y + 40, 6, 15);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // தரை
            ctx.fillStyle = "#5c2d0c";
            ctx.fillRect(0, 300, canvas.width, 50);

            // பாண்டவ வீரன் (தங்க கவச மனித வடிவம்)
            drawMan(player.x, player.y, player.width, player.height, "#ffcc00", true);

            // அஸ்திரங்கள்
            ctx.fillStyle = "#00ffff";
            bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

            // கௌரவப் படை எதிரிகள் (மனித வடிவம்)
            enemies.forEach(en => {
                drawMan(en.x, en.y, en.width, en.height, "#ff3300", false);
                ctx.fillStyle = "#fff";
                ctx.font = "11px Arial";
                ctx.fillText(en.name, en.x - 5, en.y - 5);
            });

            // UI
            ctx.fillStyle = "#fff";
            ctx.font = "14px Arial";
            ctx.fillText("ஆற்றல்: " + health + "%", 15, 25);
            ctx.fillText("மதிப்பெண்: " + score + "/100", 15, 45);

            if (isOver) {
                ctx.fillStyle = "rgba(0,0,0,0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff3300";
                ctx.font = "22px Arial";
                ctx.fillText("போரில் வீழ்ந்தீர்! (மீண்டும் தொடங்க கிளிக் செய்யவும்)", 120, 180);
            }

            if (isWin) {
                ctx.fillStyle = "rgba(0,0,0,0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#00ff00";
                ctx.font = "22px Arial";
                ctx.fillText("வெற்றி பெற்றது! (மீண்டும் தொடங்க கிளிக் செய்யவும்)", 120, 180);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
